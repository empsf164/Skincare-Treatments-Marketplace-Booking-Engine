<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — LUMÉA</title>
  <meta name="description" content="Reset your LUMÉA password.">
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/responsive.css">

  <script src="assets/js/theme.js"></script>
</head>
<body class="d-flex flex-column min-vh-100 justify-content-between">

  <header class="py-3 border-bottom bg-surface">
    <div class="container d-flex justify-content-between align-items-center">
      <a href="index.html" class="navbar-brand-lumea">
        <div class="brand-symbol">L</div>
        <div class="brand-text">
          <span class="brand-name">LUMÉA</span>
        </div>
      </a>
      <button type="button" class="btn-theme-toggle" aria-label="Theme toggle"><i class="bi bi-moon-stars-fill"></i></button>
    </div>
  </header>

  <main class="py-5 my-auto">
    <div class="container" style="max-width: 440px;">
      <div class="lumea-card p-4 p-md-5 shadow-lg">
        <div class="text-center mb-4">
          <div class="brand-symbol mx-auto mb-3" style="background:var(--brand-clay); width:48px; height:48px; font-size:1.25rem;">
            <i class="bi bi-key-fill"></i>
          </div>
          <h2 class="mb-1" style="font-family: var(--font-display);">Reset Password</h2>
          <p class="text-muted small">Enter your account email and we'll dispatch an instant reset link.</p>
        </div>

        <form id="lumeaForgotForm">
          <div class="mb-4">
            <label class="form-label" for="forgotEmail">Email Address</label>
            <input type="email" class="form-control" id="forgotEmail" placeholder="name@domain.com" required value="ananya.sharma@example.com">
          </div>

          <button type="submit" class="btn btn-primary w-100 btn-lg mb-3">
            Send Reset Instructions
          </button>

          <div class="text-center small text-muted">
            Remembered your password? <a href="login.html" class="text-sage fw-semibold text-decoration-none">Sign In</a>
          </div>
        </form>
      </div>
    </div>
  </main>

  <footer class="py-3 border-top bg-surface text-center small text-muted">
    &copy; 2026 LUMÉA Marketplace Inc.
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/notifications.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
