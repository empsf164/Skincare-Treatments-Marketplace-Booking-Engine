<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — LUMÉA</title>
  <meta name="description" content="Reset your LUMÉA password.">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/responsive.css">

  <script src="assets/js/theme.js"></script>
</head>

<body>

  <div class="auth-page-wrapper">
    <!-- Top Action Controls (Back to home) -->
    <div class="auth-top-actions">
      <a href="index.html" class="auth-back-link">
        <i class="bi bi-arrow-left"></i>
        <span>Back to Home</span>
      </a>
    </div>

    <main class="w-100" style="max-width: 460px;">
      <div class="auth-card">
        <!-- Brand Name inside Box in Top Center -->
        <div class="text-center mb-4">
          <a href="index.html" class="navbar-brand-lumea d-inline-flex align-items-center justify-content-center mb-3 text-decoration-none">
            <div class="brand-symbol">L</div>
            <div class="brand-text text-start">
              <span class="brand-name">LUMÉA</span>
              <span class="brand-tagline">Skincare Engine</span>
            </div>
          </a>
          <h2 class="mb-1" style="font-family: var(--font-display);">Reset Password</h2>
          <p class="text-muted small mb-0">Enter your account email and we'll dispatch an instant reset link.</p>
        </div>

        <form id="lumeaForgotForm">
          <!-- Email Address Input (Separate Line) -->
          <div class="mb-4">
            <label class="form-label fw-semibold small" for="forgotEmail">Email Address</label>
            <input type="email" class="form-control" id="forgotEmail" placeholder="name@domain.com" required value="ananya.sharma@example.com">
          </div>

          <!-- Submit Button -->
          <button type="submit" class="btn btn-primary w-100 btn-lg mb-3">
            Send Reset Instructions
          </button>

          <!-- Social / Fast Sign-In Options in Bottom -->
          <div class="d-flex align-items-center gap-2 my-4 text-muted small">
            <div class="flex-grow-1 border-bottom"></div>
            <span class="text-uppercase small fw-semibold" style="font-size: 0.7rem; letter-spacing: 0.08em;">Or sign in with</span>
            <div class="flex-grow-1 border-bottom"></div>
          </div>

          <div class="d-flex gap-3 mb-4">
            <button type="button" class="btn social-auth-btn flex-fill" id="btnGoogleReset">
              <i class="bi bi-google text-danger"></i>
              <span>Google</span>
            </button>
            <button type="button" class="btn social-auth-btn flex-fill" id="btnAppleReset">
              <i class="bi bi-apple"></i>
              <span>Apple</span>
            </button>
          </div>

          <div class="text-center small text-muted">
            Remembered your password? <a href="login.html" class="text-sage fw-semibold text-decoration-none">Sign In</a>
          </div>
        </form>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/notifications.js"></script>
  <script src="assets/js/auth.js"></script>
</body>

</html>
