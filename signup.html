<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — LUMÉA</title>
  <meta name="description" content="Sign up for LUMÉA as a client or register your clinical aesthetic practice.">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/responsive.css">

  <script src="assets/js/theme.js"></script>
</head>

<body>

  <div class="auth-page-wrapper">
    <main class="w-100" style="max-width: 520px;">
      <div class="auth-card">
        <!-- Brand Name inside Box in Top Center -->
        <div class="text-center mb-4">
          <a href="index.html" class="navbar-brand-lumea d-inline-flex align-items-center justify-content-center mb-3 text-decoration-none">
            <div class="brand-symbol">L</div>
            <div class="brand-text text-start">
              <span class="brand-name">LUMÉA</span>
              <span class="brand-tagline">Skincare Engine</span>
            </div>
          </a>
          <h2 class="mb-1" style="font-family: var(--font-display);">Join LUMÉA</h2>
          <p class="text-muted small mb-0">Discover better skin or list your clinic practice.</p>
        </div>

        <form id="lumeaSignupForm">
          <!-- Account Type Radio Toggle -->
          <div class="mb-4">
            <label class="form-label fw-semibold small mb-2">I am registering as a:</label>
            <div class="d-flex flex-column gap-2">
              <label class="lumea-card p-3 d-flex align-items-center gap-3 cursor-pointer border" style="cursor: pointer;">
                <input type="radio" name="signupRole" value="client" checked class="form-check-input mt-0">
                <div class="flex-grow-1">
                  <div class="fw-semibold small">Client / Patient</div>
                  <div class="text-muted" style="font-size:0.75rem;">Discover, compare & book certified treatments</div>
                </div>
              </label>
              <label class="lumea-card p-3 d-flex align-items-center gap-3 cursor-pointer border" style="cursor: pointer;">
                <input type="radio" name="signupRole" value="provider" class="form-check-input mt-0" id="roleProviderRadio">
                <div class="flex-grow-1">
                  <div class="fw-semibold small">Provider / Clinic</div>
                  <div class="text-muted" style="font-size:0.75rem;">Manage suites, calendar slots & accept deposits</div>
                </div>
              </label>
            </div>
          </div>

          <!-- Full Name Input (Separate Line) -->
          <div class="mb-3">
            <label class="form-label fw-semibold small" for="signupName">Full Name *</label>
            <input type="text" class="form-control" id="signupName" placeholder="e.g. Dr. Alisha Merchant or Ananya Sharma" required>
          </div>

          <!-- Email Address Input (Separate Line) -->
          <div class="mb-3">
            <label class="form-label fw-semibold small" for="signupEmail">Email Address *</label>
            <input type="email" class="form-control" id="signupEmail" placeholder="name@domain.com" required>
          </div>

          <!-- Provider Specific Extra Fields (shown if Provider radio active) -->
          <div id="providerSpecificFields" class="d-none p-3 bg-surface-subtle rounded-3 mb-3 border">
            <span class="badge-lumea badge-sand mb-3 d-inline-flex"><i class="bi bi-hospital me-1"></i> Clinic Onboarding</span>
            <div class="mb-3">
              <label class="form-label fw-semibold small" for="signupClinicName">Clinic or Studio Name *</label>
              <input type="text" class="form-control" id="signupClinicName" placeholder="e.g. Aesthétika Dermatology">
            </div>
            <div class="mb-1">
              <label class="form-label fw-semibold small" for="signupLocation">City & Location</label>
              <input type="text" class="form-control" id="signupLocation" placeholder="e.g. Bandra West, Mumbai">
            </div>
          </div>

          <!-- Password Input (Separate Line with Eye Toggle Icon) -->
          <div class="mb-3">
            <label class="form-label fw-semibold small" for="signupPass">Password *</label>
            <div class="position-relative">
              <input type="password" class="form-control pe-5" id="signupPass" placeholder="Create a secure password" required>
              <button type="button" class="btn-toggle-password" data-target="signupPass" aria-label="Toggle password visibility">
                <i class="bi bi-eye"></i>
              </button>
            </div>
          </div>

          <!-- Confirm Password Input (Separate Line with Eye Toggle Icon) -->
          <div class="mb-3">
            <label class="form-label fw-semibold small" for="signupPassConfirm">Confirm Password *</label>
            <div class="position-relative">
              <input type="password" class="form-control pe-5" id="signupPassConfirm" placeholder="Confirm your password" required>
              <button type="button" class="btn-toggle-password" data-target="signupPassConfirm" aria-label="Toggle password visibility">
                <i class="bi bi-eye"></i>
              </button>
            </div>
          </div>

          <!-- Terms Checkbox (Separate Line) -->
          <div class="form-check mb-4">
            <input class="form-check-input" type="checkbox" id="termsCheck" checked required>
            <label class="form-check-label small text-muted" for="termsCheck">
              I agree to LUMÉA's <a href="about.html" class="text-sage fw-medium">Terms of Service</a> & <a href="about.html" class="text-sage fw-medium">Privacy Policy</a>.
            </label>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="btn btn-primary w-100 btn-lg mb-3">
            Create Account & Continue &rarr;
          </button>

          <!-- Social Login Options in Bottom -->
          <div class="d-flex align-items-center gap-2 my-4 text-muted small">
            <div class="flex-grow-1 border-bottom"></div>
            <span class="text-uppercase small fw-semibold" style="font-size: 0.7rem; letter-spacing: 0.08em;">Or sign up with</span>
            <div class="flex-grow-1 border-bottom"></div>
          </div>

          <div class="d-flex gap-3 mb-4">
            <button type="button" class="btn social-auth-btn flex-fill" id="btnGoogleSignup">
              <i class="bi bi-google text-danger"></i>
              <span>Google</span>
            </button>
            <button type="button" class="btn social-auth-btn flex-fill" id="btnAppleSignup">
              <i class="bi bi-apple"></i>
              <span>Apple</span>
            </button>
          </div>

          <div class="text-center small text-muted">
            Already have an account? <a href="login.html" class="text-sage fw-semibold text-decoration-none">Sign In</a>
          </div>
        </form>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/notifications.js"></script>
  <script src="assets/js/auth.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('type') === 'provider') {
        const provRadio = document.getElementById('roleProviderRadio');
        if (provRadio) {
          provRadio.checked = true;
          provRadio.dispatchEvent(new Event('change'));
        }
      }
    });
  </script>
</body>

</html>
