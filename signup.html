<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — LUMÉA</title>
  <meta name="description" content="Sign up for LUMÉA as a client or register your clinical aesthetic practice.">
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/responsive.css">

  <script src="assets/js/theme.js"></script>
</head>
<body class="d-flex flex-column min-vh-100 justify-content-between">

  <!-- Minimal Header -->
  <header class="py-3 border-bottom bg-surface">
    <div class="container d-flex justify-content-between align-items-center">
      <a href="index.html" class="navbar-brand-lumea">
        <div class="brand-symbol">L</div>
        <div class="brand-text">
          <span class="brand-name">LUMÉA</span>
        </div>
      </a>
      <button type="button" class="btn-theme-toggle" aria-label="Theme toggle"><i class="bi bi-moon-stars-fill"></i></button>
    </div>
  </header>

  <main class="py-5 my-auto">
    <div class="container" style="max-width: 520px;">
      <div class="lumea-card p-4 p-md-5 shadow-lg">
        <div class="text-center mb-4">
          <h2 class="mb-1" style="font-family: var(--font-display);">Join LUMÉA</h2>
          <p class="text-muted small">Discover better skin or list your clinic practice.</p>
        </div>

        <form id="lumeaSignupForm">
          <!-- Account Type Radio Toggle -->
          <div class="mb-4">
            <label class="form-label mb-2">I am registering as a:</label>
            <div class="row g-2">
              <div class="col-6">
                <label class="lumea-card p-3 d-flex align-items-center gap-2 cursor-pointer w-100 h-100" style="cursor: pointer;">
                  <input type="radio" name="signupRole" value="client" checked class="form-check-input mt-0">
                  <div>
                    <div class="fw-semibold small">Client / Patient</div>
                    <div class="text-muted" style="font-size:0.72rem;">Book Treatments</div>
                  </div>
                </label>
              </div>
              <div class="col-6">
                <label class="lumea-card p-3 d-flex align-items-center gap-2 cursor-pointer w-100 h-100" style="cursor: pointer;">
                  <input type="radio" name="signupRole" value="provider" class="form-check-input mt-0" id="roleProviderRadio">
                  <div>
                    <div class="fw-semibold small">Provider / Clinic</div>
                    <div class="text-muted" style="font-size:0.72rem;">Manage Availability</div>
                  </div>
                </label>
              </div>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label" for="signupName">Full Name *</label>
            <input type="text" class="form-control" id="signupName" placeholder="e.g. Dr. Alisha Merchant or Ananya Sharma" required>
          </div>

          <div class="mb-3">
            <label class="form-label" for="signupEmail">Email Address *</label>
            <input type="email" class="form-control" id="signupEmail" placeholder="name@domain.com" required>
          </div>

          <!-- Provider Specific Extra Fields (shown if Provider radio active) -->
          <div id="providerSpecificFields" class="d-none p-3 bg-surface-subtle rounded-3 mb-3 border">
            <span class="badge-lumea badge-sand mb-2"><i class="bi bi-hospital"></i> Clinic Onboarding</span>
            <div class="mb-2">
              <label class="form-label" for="signupClinicName">Clinic or Studio Name *</label>
              <input type="text" class="form-control form-control-sm" id="signupClinicName" placeholder="e.g. Aesthétika Dermatology">
            </div>
            <div class="mb-2">
              <label class="form-label" for="signupLocation">City & Location</label>
              <input type="text" class="form-control form-control-sm" id="signupLocation" placeholder="e.g. Bandra West, Mumbai">
            </div>
          </div>

          <div class="row g-2 mb-3">
            <div class="col-6">
              <label class="form-label" for="signupPass">Password</label>
              <input type="password" class="form-control" id="signupPass" placeholder="••••••••" required>
            </div>
            <div class="col-6">
              <label class="form-label" for="signupPassConfirm">Confirm</label>
              <input type="password" class="form-control" id="signupPassConfirm" placeholder="••••••••" required>
            </div>
          </div>

          <div class="form-check mb-4">
            <input class="form-check-input" type="checkbox" id="termsCheck" checked required>
            <label class="form-check-label small text-muted" for="termsCheck">
              I agree to LUMÉA's <a href="about.html" class="text-sage">Terms of Service</a> & <a href="about.html" class="text-sage">Privacy Policy</a>.
            </label>
          </div>

          <button type="submit" class="btn btn-primary w-100 btn-lg mb-3">
            Create Account & Continue &rarr;
          </button>

          <div class="text-center small text-muted">
            Already have an account? <a href="login.html" class="text-sage fw-semibold text-decoration-none">Sign In</a>
          </div>
        </form>
      </div>
    </div>
  </main>

  <footer class="py-3 border-top bg-surface text-center small text-muted">
    &copy; 2026 LUMÉA Marketplace Inc.
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/notifications.js"></script>
  <script src="assets/js/auth.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('type') === 'provider') {
        const provRadio = document.getElementById('roleProviderRadio');
        if (provRadio) {
          provRadio.checked = true;
          provRadio.dispatchEvent(new Event('change'));
        }
      }
    });
  </script>
</body>
</html>
