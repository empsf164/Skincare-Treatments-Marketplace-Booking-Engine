<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — LUMÉA</title>
  <meta name="description" content="Sign in to your LUMÉA client or provider account.">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/responsive.css">

  <script src="assets/js/theme.js"></script>
</head>

<body>

  <div class="auth-page-wrapper">
    <!-- Top Action Controls (Back to home) -->
    <div class="auth-top-actions">
      <a href="index.html" class="auth-back-link">
        <i class="bi bi-arrow-left"></i>
        <span>Back to Home</span>
      </a>
    </div>

    <main class="w-100" style="max-width: 480px;">
      <div class="auth-card">
        <!-- Brand Name inside Box in Top Center -->
        <div class="text-center mb-4">
          <a href="index.html" class="navbar-brand-lumea d-inline-flex align-items-center justify-content-center mb-3 text-decoration-none">
            <div class="brand-symbol">L</div>
            <div class="brand-text text-start">
              <span class="brand-name">LUMÉA</span>
              <span class="brand-tagline">Skincare Engine</span>
            </div>
          </a>
          <h2 class="mb-1" style="font-family: var(--font-display);">Welcome Back</h2>
          <p class="text-muted small mb-0">Sign in to manage appointments or clinic availability.</p>
        </div>

        <form id="lumeaLoginForm">
          <!-- Role Selector -->
          <div class="d-flex p-1 bg-surface-subtle rounded-3 mb-4 border">
            <label class="flex-fill text-center py-2 rounded-2 cursor-pointer small fw-semibold"
              style="cursor: pointer;">
              <input type="radio" name="authRole" value="client" checked class="me-1"> Client Sign In
            </label>
            <label class="flex-fill text-center py-2 rounded-2 cursor-pointer small fw-semibold"
              style="cursor: pointer;">
              <input type="radio" name="authRole" value="provider" class="me-1"> Provider / Clinic
            </label>
          </div>

          <!-- Email Address Input (Separate Line) -->
          <div class="mb-3">
            <label class="form-label fw-semibold small" for="loginEmail">Email Address</label>
            <input type="email" class="form-control" id="loginEmail" value="ananya.sharma@example.com"
              placeholder="name@domain.com" required>
          </div>

          <!-- Password Input (Separate Line) -->
          <div class="mb-3">
            <label class="form-label fw-semibold small" for="loginPassword">Password</label>
            <input type="password" class="form-control" id="loginPassword" value="••••••••••••"
              placeholder="Enter password" required>
          </div>

          <!-- Remember Me & Forgot Password in Same Line -->
          <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="form-check mb-0">
              <input class="form-check-input" type="checkbox" id="rememberMe" checked>
              <label class="form-check-label small text-secondary cursor-pointer" for="rememberMe">Remember me</label>
            </div>
            <a href="forgot-password.html" class="small text-sage text-decoration-none fw-semibold">Forgot password?</a>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="btn btn-primary w-100 btn-lg mb-3">
            Sign In to LUMÉA
          </button>

          <!-- Social Login Options in Bottom -->
          <div class="d-flex align-items-center gap-2 my-4 text-muted small">
            <div class="flex-grow-1 border-bottom"></div>
            <span class="text-uppercase small fw-semibold" style="font-size: 0.7rem; letter-spacing: 0.08em;">Or continue with</span>
            <div class="flex-grow-1 border-bottom"></div>
          </div>

          <div class="d-flex gap-3 mb-4">
            <button type="button" class="btn social-auth-btn flex-fill" id="btnGoogleLogin">
              <i class="bi bi-google text-danger"></i>
              <span>Google</span>
            </button>
            <button type="button" class="btn social-auth-btn flex-fill" id="btnAppleLogin">
              <i class="bi bi-apple"></i>
              <span>Apple</span>
            </button>
          </div>

          <div class="text-center small text-muted">
            Don't have an account? <a href="signup.html" class="text-sage fw-semibold text-decoration-none">Sign Up</a>
          </div>
        </form>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/notifications.js"></script>
  <script src="assets/js/auth.js"></script>
</body>

</html>
