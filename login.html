<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — LUMÉA</title>
  <meta name="description" content="Sign in to your LUMÉA client or provider account.">
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/responsive.css">

  <script src="assets/js/theme.js"></script>
</head>
<body class="d-flex flex-column min-vh-100 justify-content-between">

  <!-- Minimal Header -->
  <header class="py-3 border-bottom bg-surface">
    <div class="container d-flex justify-content-between align-items-center">
      <a href="index.html" class="navbar-brand-lumea">
        <div class="brand-symbol">L</div>
        <div class="brand-text">
          <span class="brand-name">LUMÉA</span>
        </div>
      </a>
      <button type="button" class="btn-theme-toggle" aria-label="Theme toggle"><i class="bi bi-moon-stars-fill"></i></button>
    </div>
  </header>

  <main class="py-5 my-auto">
    <div class="container" style="max-width: 460px;">
      <div class="lumea-card p-4 p-md-5 shadow-lg">
        <div class="text-center mb-4">
          <h2 class="mb-1" style="font-family: var(--font-display);">Welcome Back</h2>
          <p class="text-muted small">Sign in to manage appointments or clinic availability.</p>
        </div>

        <form id="lumeaLoginForm">
          <!-- Role Selector -->
          <div class="d-flex p-1 bg-surface-subtle rounded-3 mb-4 border">
            <label class="flex-fill text-center py-2 rounded-2 cursor-pointer small fw-semibold" style="cursor: pointer;">
              <input type="radio" name="authRole" value="client" checked class="me-1"> Client Sign In
            </label>
            <label class="flex-fill text-center py-2 rounded-2 cursor-pointer small fw-semibold" style="cursor: pointer;">
              <input type="radio" name="authRole" value="provider" class="me-1"> Provider / Clinic
            </label>
          </div>

          <div class="mb-3">
            <label class="form-label" for="loginEmail">Email Address</label>
            <input type="email" class="form-control" id="loginEmail" value="ananya.sharma@example.com" placeholder="name@domain.com" required>
          </div>

          <div class="mb-3">
            <div class="d-flex justify-content-between align-items-center mb-1">
              <label class="form-label mb-0" for="loginPassword">Password</label>
              <a href="forgot-password.html" class="small text-sage text-decoration-none">Forgot password?</a>
            </div>
            <input type="password" class="form-control" id="loginPassword" value="••••••••••••" placeholder="Enter password" required>
          </div>

          <div class="form-check mb-4">
            <input class="form-check-input" type="checkbox" id="rememberMe" checked>
            <label class="form-check-label small" for="rememberMe">Remember my login</label>
          </div>

          <button type="submit" class="btn btn-primary w-100 btn-lg mb-3">
            Sign In to LUMÉA
          </button>

          <!-- Social Login Placeholders -->
          <div class="d-flex align-items-center gap-2 my-3 text-muted small">
            <div class="flex-grow-1 border-bottom"></div>
            <span>or continue with</span>
            <div class="flex-grow-1 border-bottom"></div>
          </div>

          <div class="d-flex gap-2 mb-4">
            <button type="button" class="btn btn-outline-secondary w-50 btn-sm">
              <i class="bi bi-google me-1"></i> Google
            </button>
            <button type="button" class="btn btn-outline-secondary w-50 btn-sm">
              <i class="bi bi-apple me-1"></i> Apple
            </button>
          </div>

          <div class="text-center small text-muted">
            Don't have an account? <a href="signup.html" class="text-sage fw-semibold text-decoration-none">Sign Up</a>
          </div>
        </form>
      </div>
    </div>
  </main>

  <footer class="py-3 border-top bg-surface text-center small text-muted">
    &copy; 2026 LUMÉA Marketplace Inc.
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/notifications.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
